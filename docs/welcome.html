<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Completing Sign-in · IOSP 2026</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="page">
      <header class="header"><span class="brand">IOSP 2026</span></header>
      <div class="intro">
        <h1>Finishing sign-in…</h1>
        <p id="status" class="supporting" role="status">Confirming your account.</p>
        <p><a href="./index.html">Back to the workshop</a></p>
      </div>
    </main>
    <script type="module">
      import { restoreSession } from "./oauth.js";
      try {
        const result = await restoreSession();
        if (!result) throw new Error("No sign-in session was returned.");
        location.replace("./index.html");
      } catch (error) {
        document.getElementById("status").textContent = `Sign-in could not be completed: ${error.message}`;
      }
    </script>
  </body>
</html>
